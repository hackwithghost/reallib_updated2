kind = "web"
previewPath = "/reallib/"
title = "RealLib - Library Attendance System"
version = "1.0.0"
id = "artifacts/reallib"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/reallib/", "/api" ]
localPort = 23952

[services.development]
run = "pnpm --filter @workspace/reallib run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reallib", "run", "build" ]
publicDir = "artifacts/reallib/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23952"
BASE_PATH = "/reallib/"
